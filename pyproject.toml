[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-justice"
version = "0.1.0"
description = "Mathematical modeling, operationalization, and empirical testing of spatial access disparities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Monour Hosan Saif", email = "115137255+monourhosan@users.noreply.github.com" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "osmnx>=2.0.0",
    "networkx>=3.0",
    "scipy>=1.14.0",
    "matplotlib>=3.8.0",
    "folium>=0.17.0",
    "libpysal>=4.12.0",
    "esda>=2.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
